<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <defs>
    <pattern id="goDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3.4" fill="#12100E" fill-opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="#22C55E"/>
  <rect width="800" height="800" fill="url(#goDots)"/>
  <!-- upward chevrons: momentum -->
  <g stroke="#12100E" stroke-width="34" stroke-linecap="square" fill="none" opacity="0.9">
    <polyline points="180,560 400,360 620,560"/>
    <polyline points="180,700 400,500 620,700"/>
  </g>
  <!-- confetti burst -->
  <g fill="#F4F1EA">
    <circle cx="150" cy="180" r="18"/><circle cx="650" cy="150" r="14"/>
    <circle cx="700" cy="330" r="20"/><circle cx="110" cy="360" r="12"/>
    <rect x="520" y="230" width="30" height="30" transform="rotate(24 535 245)"/>
    <rect x="250" y="120" width="24" height="24" transform="rotate(-18 262 132)"/>
  </g>
  <rect x="12" y="12" width="776" height="776" fill="none" stroke="#12100E" stroke-width="24"/>
</svg>
