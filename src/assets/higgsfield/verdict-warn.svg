<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <defs>
    <pattern id="warnStripes" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="40" height="80" fill="#12100E" fill-opacity="0.16"/>
    </pattern>
    <pattern id="warnDots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="3.2" fill="#12100E" fill-opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="#F5B400"/>
  <rect width="800" height="800" fill="url(#warnStripes)"/>
  <rect width="800" height="800" fill="url(#warnDots)"/>
  <!-- caution lozenge -->
  <g transform="translate(400 400) rotate(45)">
    <rect x="-150" y="-150" width="300" height="300" rx="24" fill="none" stroke="#12100E" stroke-width="30"/>
  </g>
  <rect x="12" y="12" width="776" height="776" fill="none" stroke="#12100E" stroke-width="24"/>
</svg>
