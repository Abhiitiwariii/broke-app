<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720" fill="none">
  <defs>
    <pattern id="heroDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3.4" fill="#FF3B30" fill-opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1080" height="720" fill="#12100E"/>
  <!-- hot-red diagonal sweep, lower band -->
  <polygon points="0,470 1080,300 1080,720 0,720" fill="#FF3B30" fill-opacity="0.9"/>
  <polygon points="0,470 1080,300 1080,720 0,720" fill="url(#heroDots)"/>
  <!-- big paper quarter-arc, bottom-right negative-space balance -->
  <path d="M1080 720 A360 360 0 0 0 720 720 Z" fill="#F4F1EA" fill-opacity="0.12"/>
  <!-- rising coins: ascending stacks left to right -->
  <g stroke="#12100E" stroke-width="6">
    <g transform="translate(150 600)">
      <ellipse cx="0" cy="0" rx="48" ry="18" fill="#F5B400"/>
      <ellipse cx="0" cy="-22" rx="48" ry="18" fill="#F5B400"/>
    </g>
    <g transform="translate(330 540)">
      <ellipse cx="0" cy="0" rx="48" ry="18" fill="#F4F1EA"/>
      <ellipse cx="0" cy="-22" rx="48" ry="18" fill="#F4F1EA"/>
      <ellipse cx="0" cy="-44" rx="48" ry="18" fill="#F4F1EA"/>
    </g>
    <g transform="translate(520 470)">
      <ellipse cx="0" cy="0" rx="48" ry="18" fill="#F5B400"/>
      <ellipse cx="0" cy="-22" rx="48" ry="18" fill="#F5B400"/>
      <ellipse cx="0" cy="-44" rx="48" ry="18" fill="#F5B400"/>
      <ellipse cx="0" cy="-66" rx="48" ry="18" fill="#F5B400"/>
    </g>
  </g>
  <!-- small paper accent dots, upper-right -->
  <g fill="#F4F1EA" fill-opacity="0.55">
    <circle cx="900" cy="120" r="9"/><circle cx="960" cy="180" r="6"/><circle cx="850" cy="180" r="5"/>
  </g>
</svg>
