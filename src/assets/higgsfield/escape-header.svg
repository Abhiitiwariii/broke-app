<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" fill="none">
  <defs>
    <pattern id="escDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3.4" fill="#F4F1EA" fill-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="1080" height="600" fill="#6C5CE7"/>
  <rect width="1080" height="600" fill="url(#escDots)"/>
  <!-- horizon glow, right side (aspirational escape) -->
  <circle cx="820" cy="300" r="230" fill="#F5B400" fill-opacity="0.25"/>
  <!-- open doorway with light -->
  <g transform="translate(760 150)">
    <rect x="0" y="0" width="200" height="320" rx="8" fill="none" stroke="#12100E" stroke-width="16"/>
    <rect x="34" y="34" width="132" height="252" fill="#F4F1EA" fill-opacity="0.9"/>
    <rect x="150" y="150" width="18" height="40" fill="#12100E"/>
  </g>
  <!-- ladder rungs climbing toward the door -->
  <g stroke="#12100E" stroke-width="14" stroke-linecap="round">
    <line x1="560" y1="480" x2="600" y2="200"/>
    <line x1="640" y1="480" x2="680" y2="200"/>
    <line x1="576" y1="420" x2="664" y2="420"/>
    <line x1="588" y1="350" x2="676" y2="350"/>
    <line x1="600" y1="280" x2="688" y2="280"/>
  </g>
</svg>
