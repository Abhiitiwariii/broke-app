<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" fill="none">
  <defs>
    <pattern id="shareDots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="3.6" fill="#FF3B30" fill-opacity="0.55"/>
    </pattern>
    <radialGradient id="shareClear" cx="50%" cy="46%" r="42%">
      <stop offset="60%" stop-color="#F4F1EA" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F4F1EA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1350" fill="#F4F1EA"/>
  <!-- halftone burst on the edges -->
  <rect width="1080" height="1350" fill="url(#shareDots)"/>
  <!-- clear central safe-zone (verdict + numbers sit here) -->
  <rect width="1080" height="1350" fill="url(#shareClear)"/>
  <!-- energetic corner blocks -->
  <g fill="#12100E">
    <polygon points="0,0 260,0 0,260"/>
    <polygon points="1080,1350 820,1350 1080,1090"/>
  </g>
  <g fill="#FF3B30">
    <polygon points="1080,0 1080,180 900,0"/>
    <polygon points="0,1350 0,1170 180,1350"/>
  </g>
</svg>
